
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeMusic - Webplayer</title>
    
    <meta property="og:title" content="MeMusic - Webplayer" />
    <meta property="og:description" content="A complete music web player with a Frutiger Metro aesthetic." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cute+Font&family=Epilogue:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
  
<style>
    :root { 
        --font-sans: 'Epilogue', sans-serif; 
        --accent: #fc4b08;
        --accent-glow: rgba(252, 75, 8, 0.6);
        --bg-depth: #050505;
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-surface: rgba(20, 20, 20, 0.6);
    }
    
    html { 
        scroll-behavior: smooth; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    
    body { 
        font-family: var(--font-sans); 
        background-color: var(--bg-depth);
        color: #e5e5e5;
        overflow: hidden;
    }

    .cinematic-bg {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 0;
        pointer-events: none;
        background: #000;
        overflow: hidden;
        perspective: 1000px;
    }

    .bg-layer-deep {
        position: absolute;
        inset: -20%;
        width: 140%;
        height: 140%;
        background-size: cover;
        background-position: center;
        filter: blur(120px) saturate(1.2) brightness(0.4);
        opacity: 0;
        transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), filter 2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1;
        animation: deep-breathe 25s infinite ease-in-out alternate;
    }

    .bg-layer-light {
        position: absolute;
        top: -50%; left: -50%;
        width: 200%; height: 200%;
        background-size: cover;
        background-position: center;
        filter: blur(80px) saturate(1.8) contrast(1.2);
        opacity: 0;
        mix-blend-mode: hard-light;
        transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), filter 2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 2;
        animation: fluid-rotate 45s infinite linear;
    }

    .orb-canvas {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.5;
        filter: blur(90px);
    }
    .orb {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        animation: orb-drift 20s infinite ease-in-out alternate;
    }
    .orb-1 { width: 50vw; height: 50vw; background: #2a1b3d; top: 0; left: 0; animation-delay: 0s; }
    .orb-2 { width: 60vw; height: 60vw; background: #3d1b1b; bottom: 0; right: 0; animation-delay: -5s; }

    @keyframes deep-breathe {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.1) translate(-2%, 2%); }
    }

    @keyframes fluid-rotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.2); }
        100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes orb-drift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(10%, 10%); }
    }

    .cinematic-bg.is-playing .bg-layer-deep {
    }
    
    .cinematic-bg.is-playing .bg-layer-light {
        filter: blur(70px) saturate(2) contrast(1.3);
    }

    .film-grain {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 3;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
    }

    .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 20%, rgba(5,5,5,0.3) 60%, rgba(0,0,0,0.9) 100%);
        z-index: 4;
        pointer-events: none;
    }

   
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { 
        background-color: rgba(255, 255, 255, 0.15); 
        border-radius: 10px; 
        border: 2px solid transparent;
        background-clip: content-box;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.4); }
    .custom-scrollbar-hidden::-webkit-scrollbar { display: none; }
    .custom-scrollbar-hidden { -ms-overflow-style: none; scrollbar-width: none; }

    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -4px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        transform: scale(0);
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-runnable-track {
        background: linear-gradient(to right, #fff var(--volume-progress), rgba(255,255,255,0.1) var(--volume-progress));
    }
    
    .reverb-slider::-webkit-slider-runnable-track {
        background: linear-gradient(to right, #fc4b08 var(--reverb-progress), rgba(255,255,255,0.1) var(--reverb-progress));
    }

    .group:hover input[type=range]::-webkit-slider-thumb,
    input[type=range]:hover::-webkit-slider-thumb,
    input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1);
    }
    
    .group:hover input[type=range]::-webkit-slider-runnable-track,
    input[type=range]:hover::-webkit-slider-runnable-track {
        background: rgba(255, 255, 255, 0.2);
    }
    
    .volume-slider:hover::-webkit-slider-runnable-track {
        background: linear-gradient(to right, #fc4b08 var(--volume-progress), rgba(255,255,255,0.2) var(--volume-progress));
    }

    .playlist-item-enter { animation: slide-in-stagger 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    @keyframes slide-in-stagger { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .play-pause-container svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .play-pause-container .play-icon { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    .play-pause-container .pause-icon { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-90deg); }
    .play-pause-container.is-playing .play-icon { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(90deg); }
    .play-pause-container.is-playing .pause-icon { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }

    .view-enter-forward { animation: fade-slide-in 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .view-enter-backward { animation: fade-slide-out 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fade-slide-in { from { opacity: 0; transform: translateY(20px) scale(0.99); filter: blur(5px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes fade-slide-out { from { opacity: 0; transform: translateY(-20px) scale(0.99); filter: blur(5px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

    @keyframes image-appear { 
        from { opacity: 0; transform: scale(0.95); filter: blur(10px); } 
        to { opacity: 1; transform: scale(1); filter: blur(0); } 
    }
    .animate-image-appear { animation: image-appear 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    .glass-panel {
        background: var(--glass-surface);
        backdrop-filter: blur(40px) saturate(150%);
        -webkit-backdrop-filter: blur(40px) saturate(150%);
        border: 1px solid var(--glass-border);
        box-shadow: 
            0 4px 30px rgba(0, 0, 0, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .glass-panel-heavy {
        background: rgba(8, 8, 8, 0.85);
        backdrop-filter: blur(50px) saturate(180%);
        -webkit-backdrop-filter: blur(50px) saturate(180%);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 
            0 -10px 40px rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .eq-slider-container { display: flex; align-items: center; justify-content: center; width: 2rem; height: 10rem; }
    .eq-slider { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; width: 9rem; transform: rotate(-90deg); }
    .eq-slider::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.1); height: 4px; border-radius: 2px; }
    .eq-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -6px; width: 16px; height: 16px; background: var(--accent); border: 2px solid #121212; border-radius: 50%; box-shadow: 0 0 10px var(--accent-glow); }
</style>
